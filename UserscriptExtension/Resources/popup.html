<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Userscript</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Top Navigation Bar (Safari Native) -->
    <header class="navbar">
      <div class="nav-brand">
        <div class="app-avatar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <span class="app-title">Userscript</span>
          <span id="version-tag" class="app-sub">Safari Runtime</span>
        </div>
      </div>

      <div class="nav-actions">
        <!-- Quick Emergency Killswitch Icon -->
        <button id="emergency-btn" class="nav-icon-btn" title="Emergency Pause All Scripts">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </button>
        <!-- Reload Page Button -->
        <button id="reload-tab-btn" class="nav-icon-btn" title="Reload Active Tab">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Master Website Card (Clean iOS Style) -->
    <div class="domain-banner">
      <div class="domain-avatar" id="domain-avatar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </div>
      <div class="domain-info">
        <div class="domain-name-row">
          <span id="current-domain" class="domain-name">Detecting site...</span>
        </div>
        <span id="domain-status" class="domain-status">Checking rules...</span>
      </div>
      
      <!-- Master Domain Toggle Switch -->
      <label class="switch-control" title="Enable/Disable all userscripts on this site">
        <input type="checkbox" id="site-master-toggle" checked>
        <span class="switch-track"></span>
      </label>
    </div>

    <!-- Scripts Section Header -->
    <div class="section-bar">
      <span class="section-title">ACTIVE ON THIS SITE</span>
      <span id="match-badge" class="badge-count">0</span>
    </div>

    <!-- Script List Container -->
    <main class="script-scroll-area">
      <div id="script-list" class="script-grouped-list">
        <!-- Rendered dynamically -->
      </div>
    </main>

    <!-- Bottom Action Bar (Safari Toolbar Style) -->
    <footer class="bottom-toolbar">
      <button id="add-script-btn" class="tool-btn" title="Create or Install Script">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New Script</span>
      </button>

      <div class="tool-divider"></div>

      <button id="open-app-btn" class="tool-btn primary" title="Open Full Control Center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Open App</span>
      </button>
    </footer>

    <!-- Modal Sheet for Script Temporary Controls (Options) -->
    <div id="options-sheet" class="sheet-backdrop hidden">
      <div class="sheet-container">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <span id="sheet-script-title" class="sheet-title">Script Settings</span>
          <button id="sheet-close-btn" class="sheet-close">Done</button>
        </div>
        <div class="sheet-body">
          <div class="sheet-menu-group">
            <button class="sheet-item" id="sheet-pause-5m">
              <span class="sheet-item-label">Pause for 5 Minutes</span>
              <span class="sheet-item-desc">Resume automatically after 5m</span>
            </button>
            <button class="sheet-item" id="sheet-pause-1h">
              <span class="sheet-item-label">Pause for 1 Hour</span>
              <span class="sheet-item-desc">Resume automatically after 1h</span>
            </button>
            <button class="sheet-item" id="sheet-resume-now">
              <span class="sheet-item-label sheet-highlight">Resume Execution Now</span>
              <span class="sheet-item-desc">Clear any temporary suspensions</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
