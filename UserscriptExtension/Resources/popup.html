<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Userscript Website Panel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header: App Brand & Emergency Killswitch -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span class="brand-name">Userscript</span>
      </div>
      <div class="header-actions">
        <button id="emergency-btn" class="emergency-btn" title="Emergency Disable All Scripts">
          <span class="pulse-dot"></span>
          <span id="emergency-label">Killswitch</span>
        </button>
      </div>
    </header>

    <!-- Domain Card: Current Website Status (Section 20) -->
    <div class="site-card">
      <div class="site-header">
        <div class="site-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </div>
        <div class="site-details">
          <div id="current-domain" class="site-domain">Detecting tab...</div>
          <div id="stats-summary" class="site-subtitle">0 matched • 0 running</div>
        </div>
        <span id="badge" class="count-badge">0</span>
      </div>

      <div class="site-actions">
        <button id="reload-tab-btn" class="site-action-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Reload
        </button>
        <button id="block-domain-btn" class="site-action-btn danger">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
          </svg>
          <span id="block-btn-text">Disable on Site</span>
        </button>
      </div>
    </div>

    <!-- Script List Section -->
    <div class="section-title-row">
      <span class="section-label">Matched Scripts</span>
      <span id="script-count-label" class="section-badge">0 Active</span>
    </div>

    <div id="script-list" class="script-list">
      <div class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <p>No scripts matched this website</p>
      </div>
    </div>

    <!-- Footer: Open Native Manager App -->
    <footer class="app-footer">
      <a href="#" id="open-app-btn" class="open-manager-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        Open Control Center
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
